services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: english-ai-active-reading:latest
    container_name: english-ai
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - ./data/magazines:/app/data/magazines
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
